# The plugin's tests, against the Luccet engine they are a client of: a
# checkout of Luccet/luccet beside this one, named by LUCCET_ROOT. The engine
# does not test the plugin; the dependency runs this one way.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests against Luccet's main (Neovim stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: luccet.nvim
      - uses: actions/checkout@v7
        with:
          repository: Luccet/luccet
          path: luccet
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --version | head -1
      - run: nvim --headless -u NONE -l test/run.lua
        working-directory: luccet.nvim
        env:
          LUCCET_ROOT: ${{ github.workspace }}/luccet
